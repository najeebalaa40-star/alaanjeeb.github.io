<!doctype html>

<head>

<title>علاء نجيب | DIAMONDTOUCH</title>

<!-- مكتبة Font Awesome للأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');

:root {
  color-scheme: dark;
  --gold: #f59e0b;
  --gold-glow: #fef08a;
  --blue: #3b82f6;
  --red: #f43f5e;
  --green: #10b981;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: #070913;
  font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
  color: #f8fafc;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  position: relative;
  overflow-x: hidden;
}

/* خلفية ديناميكية متحركة */
.bg-glow {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 0;
}

.bg-blob {
  position: absolute;
  filter: blur(80px);
  border-radius: 50%;
  opacity: 0.35;
  animation: floatOrb 12s infinite alternate ease-in-out;
}

.blob-1 { width: 300px; height: 300px; background: var(--gold); top: -50px; right: -50px; }
.blob-2 { width: 280px; height: 280px; background: var(--blue); bottom: -40px; left: -40px; animation-delay: -3s; }
.blob-3 { width: 250px; height: 250px; background: var(--red); top: 40%; left: -80px; animation-delay: -6s; }
.blob-4 { width: 220px; height: 220px; background: var(--green); bottom: 20%; right: -60px; animation-delay: -9s; }

@keyframes floatOrb {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(30px, 40px) scale(1.15); }
}

main {
  position: relative;
  z-index: 1;
  width: min(100%, 420px);
  text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(13, 18, 30, 0.7);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border-radius: 36px;
  padding: 36px 24px;
  box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255,255,255,0.2);
}

/* دائرة اللوجو */
.avatar-container {
  position: relative;
  width: 120px;
  height: 120px;
  margin: 0 auto 20px;
}

.thread-ring {
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  background: conic-gradient(var(--gold), var(--red), var(--blue), var(--green), var(--gold));
  animation: spinThread 8s linear infinite;
  opacity: 0.85;
}

@keyframes spinThread {
  100% { transform: rotate(360deg); }
}

.logo-box {
  position: absolute;
  inset: 0;
  background: #ffffff;
  border-radius: 50%;
  padding: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

.logo-box img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 50%;
}

.needle-icon {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%) rotate(25deg);
  font-size: 20px;
  color: var(--gold-glow);
  text-shadow: 0 0 10px var(--gold);
}

/* الاسم والعنوان */
h1 {
  font-size: 30px;
  font-weight: 900;
  letter-spacing: -0.5px;
  margin-bottom: 6px;
  background: linear-gradient(135deg, #ffffff 40%, var(--gold-glow) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  color: #94a3b8;
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 14px;
}

/* نص "اضغط هنا" المتحرك */
.click-here-text {
  font-size: 12px;
  font-weight: 800;
  color: var(--gold-glow);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  animation: bounceArrow 1.5s infinite ease-in-out;
}

@keyframes bounceArrow {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* رابط زر دايموند تتش المطور */
a.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.8px;
  color: #fef08a;
  text-decoration: none;
  background: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(59,130,246,0.2));
  padding: 8px 20px;
  border-radius: 30px;
  border: 1px solid rgba(245,158,11,0.4);
  margin-bottom: 28px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  transition: all 0.3s ease;
}

a.brand-badge:hover {
  transform: scale(1.05);
  border-color: var(--gold-glow);
  box-shadow: 0 0 20px rgba(245,158,11,0.5);
  background: linear-gradient(135deg, rgba(245,158,11,0.35), rgba(59,130,246,0.35));
}

a.brand-badge i { color: var(--gold); }

/* الأزرار العصرية */
.links-wrapper {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card-link {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-decoration: none;
  color: #f8fafc;
  padding: 16px 20px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  overflow: hidden;
}

.card-link::before {
  content: "";
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 4px;
  border-radius: 0 20px 20px 0;
}

.card-link .btn-content {
  display: flex;
  align-items: center;
  gap: 14px;
}

.card-link .icon-box {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  background: rgba(255, 255, 255, 0.05);
}

.card-link .btn-text { text-align: right; }
.card-link .btn-title { font-weight: 700; font-size: 16px; display: block; }
.card-link .btn-sub { font-size: 11px; color: #94a3b8; font-weight: 500; }
.card-link .arrow { font-size: 12px; color: #64748b; transition: all 0.3s ease; }

.wa::before { background: var(--green); }
.wa .icon-box { color: #25D366; background: rgba(37,211,102,0.15); }
.wa:hover { border-color: rgba(37,211,102,0.5); box-shadow: 0 10px 25px rgba(37,211,102,0.2); }

.fb::before { background: var(--blue); }
.fb .icon-box { color: #1877F2; background: rgba(24,119,242,0.15); }
.fb:hover { border-color: rgba(24,119,242,0.5); box-shadow: 0 10px 25px rgba(24,119,242,0.2); }

.ig::before { background: var(--red); }
.ig .icon-box { color: #E4405F; background: rgba(228,64,95,0.15); }
.ig:hover { border-color: rgba(228,64,95,0.5); box-shadow: 0 10px 25px rgba(228,64,95,0.2); }

.tk::before { background: #25F4EE; }
.tk .icon-box { color: #25F4EE; background: rgba(37,244,238,0.15); }
.tk:hover { border-color: rgba(37,244,238,0.5); box-shadow: 0 10px 25px rgba(37,244,238,0.2); }

.card-link:hover { transform: translateY(-4px) scale(1.01); }
.card-link:hover .arrow { color: #fff; transform: translateX(-4px); }

/* QR Code */
.qr-section {
  margin-top: 30px;
  padding-top: 24px;
  border-top: 1px dashed rgba(255, 255, 255, 0.12);
}

.qr-card {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 24px;
  padding: 16px;
  display: inline-block;
}

.qr-card img {
  width: 130px;
  height: 130px;
  border-radius: 12px;
  background: #fff;
  padding: 8px;
  display: block;
}

.hint-text { font-size: 12px; color: #94a3b8; margin-top: 12px; line-height: 1.6; }
</style>
</head>

</main>
