<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>علاء نجيب | DIAMONDTOUCH</title>

<!-- مكتبة Font Awesome للأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root {
  color-scheme: dark;
  --gold-primary: #e5c477;
  --gold-secondary: #a77d35;
  --navy-dark: #0f172a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #1e293b 0%, #0f172a 60%, #080d1a 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, Arial, sans-serif;
  color: #f8fafc;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

main {
  width: min(100%, 430px);
  text-align: center;
  border: 1px solid rgba(229, 196, 119, 0.25);
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(16px);
  border-radius: 28px;
  padding: 32px 22px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(229, 196, 119, 0.1);
}

/* تصميم دائرة اللوجو في الأعلى */
.logo-wrapper {
  width: 110px;
  height: 110px;
  margin: 0 auto 16px;
  background: #ffffff;
  border-radius: 50%;
  padding: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 3px solid var(--gold-primary);
  box-shadow: 0 8px 25px rgba(229, 196, 119, 0.3);
  transition: transform 0.3s ease;
}

.logo-wrapper:hover {
  transform: scale(1.05);
}

.logo-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 50%;
}

h1 {
  font-size: 26px;
  font-weight: 800;
  margin: 8px 0 4px;
  background: linear-gradient(135deg, #ffffff 40%, var(--gold-primary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  color: #94a3b8;
  font-size: 14px;
  font-weight: 500;
  margin: 0 0 6px;
}

.brand-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1px;
  color: var(--gold-primary);
  font-weight: 700;
  margin-bottom: 22px;
  background: rgba(229, 196, 119, 0.1);
  padding: 4px 14px;
  border-radius: 20px;
  border: 1px solid rgba(229, 196, 119, 0.25);
}

/* تنسيق قائمة الروابط */
.links {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

a.link-item {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-decoration: none;
  color: #f8fafc;
  padding: 15px 18px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.04);
  border-radius: 16px;
  font-weight: 650;
  font-size: 15px;
  transition: all 0.3s ease;
}

a.link-item:hover {
  background: rgba(229, 196, 119, 0.12);
  border-color: rgba(229, 196, 119, 0.5);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
}

a.link-item i {
  font-size: 20px;
}

/* ألوان الأيقونات المخصصة */
.fa-whatsapp { color: #25D366; }
.fa-facebook { color: #1877F2; }
.fa-instagram { color: #E4405F; }
.fa-tiktok { color: #25F4EE; }

/* قسم رمز QR */
.qr-container {
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.qr-box {
  background: #ffffff;
  padding: 10px;
  border-radius: 16px;
  display: inline-block;
  margin-bottom: 12px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
}

.qr-box img {
  display: block;
  width: 120px;
  height: 120px;
}

.hint {
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.7;
}
</style>
</head>
<body>

<main>
  <!-- شعار Diamond Touch داخل الدائرة الذهبية أعلى الاسم -->
  <div class="logo-wrapper">
    <img src="logo.png" alt="DIAMONDTOUCH Logo">
  </div>

  <h1>علاء نجيب</h1>
  <p class="subtitle">تواصل معي وتابع حساباتي</p>
  <div class="brand-tag">DIAMONDTOUCH • Promotion & Advertising</div>

  <div class="links">
    <a href="https://wa.me/249999963991" target="_blank" rel="noopener" class="link-item">
      <i class="fa-brands fa-whatsapp"></i>
      <span>واتساب · +249999963991</span>
    </a>

    <a href="https://www.facebook.com/share/19MTqK4BMS/?mibextid=wwXIfr" target="_blank" rel="noopener" class="link-item">
      <i class="fa-brands fa-facebook"></i>
      <span>فيسبوك</span>
    </a>

    <a href="https://www.instagram.com/3ala.m.najeeb?rpxt=MTBxM3gyNnFteGk5aQ%3D%3D&utm_source=qr" target="_blank" rel="noopener" class="link-item">
      <i class="fa-brands fa-instagram"></i>
      <span>إنستغرام</span>
    </a>

    <a href="https://www.tiktok.com/@alaanajeeb?_r=1&_t=ZS-9AOczcJsbET" target="_blank" rel="noopener" class="link-item">
      <i class="fa-brands fa-tiktok"></i>
      <span>تيك توك</span>
    </a>
  </div>

  <!-- قسم الـ QR Code -->
  <div class="qr-container">
    <div class="qr-box">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://najeebalaa40-star.github.io" alt="QR Code">
    </div>
    <div class="hint">
      <i class="fa-solid fa-qrcode"></i> امسح رمز QR أعلاه أو قرّب هاتفك من بطاقة NFC لفتح صفحتك مباشرة.
    </div>
  </div>
</main>

</body>
</html>
