<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>علاء نجيب | حساباتي</title>

<!-- مكتبة Font Awesome للأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(145deg, #101827, #172b3e 55%, #111827);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, Arial, sans-serif;
  color: #f8fafc;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
main {
  width: min(100%, 430px);
  text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  border-radius: 28px;
  padding: 30px 22px;
  box-shadow: 0 18px 55px rgba(0, 0, 0, 0.5);
}
.avatar {
  width: 86px;
  height: 86px;
  border-radius: 50%;
  margin: 0 auto 16px;
  background: linear-gradient(135deg, #e5c477, #a77d35);
  display: grid;
  place-items: center;
  color: #111827;
  font-size: 30px;
  font-weight: 800;
  box-shadow: 0 4px 15px rgba(229, 196, 119, 0.3);
}
h1 { font-size: 28px; margin: 8px 0; }
p { color: #cbd5e1; margin: 0 0 24px; font-size: 15px; }

.links {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
a {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-decoration: none;
  color: #f8fafc;
  padding: 15px 18px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.05);
  border-radius: 14px;
  font-weight: 650;
  font-size: 16px;
  transition: all 0.25s ease;
}
a:hover {
  background: rgba(255, 255, 255, 0.15);
  transform: translateY(-2px);
  border-color: rgba(255, 255, 255, 0.35);
}
a i { font-size: 20px; }

/* ألوان الأيقونات المخصصة */
.fa-whatsapp { color: #25D366; }
.fa-facebook { color: #1877F2; }
.fa-instagram { color: #E4405F; }
.fa-tiktok { color: #25F4EE; }

/* قسم رمز QR */
.qr-container {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
}
.qr-box {
  background: #ffffff;
  padding: 10px;
  border-radius: 16px;
  display: inline-block;
  margin-bottom: 12px;
}
.qr-box img {
  display: block;
  width: 130px;
  height: 130px;
  border-radius: 8px;
}
.hint {
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.7;
}
</style>
</head>
<body>

<main>
  <div class="avatar">ع ن</div>
  <h1>علاء نجيب</h1>
  <p>تواصل معي وتابع حساباتي</p>

  <div class="links">
    <a href="https://wa.me/249999963991" target="_blank" rel="noopener">
      <i class="fa-brands fa-whatsapp"></i>
      <span>واتساب · +249999963991</span>
    </a>

    <a href="https://www.facebook.com/share/19MTqK4BMS/?mibextid=wwXIfr" target="_blank" rel="noopener">
      <i class="fa-brands fa-facebook"></i>
      <span>فيسبوك</span>
    </a>

    <a href="https://www.instagram.com/3ala.m.najeeb?rpxt=MTBxM3gyNnFteGk5aQ%3D%3D&utm_source=qr" target="_blank" rel="noopener">
      <i class="fa-brands fa-instagram"></i>
      <span>إنستغرام</span>
    </a>

    <a href="https://www.tiktok.com/@alaanajeeb?_r=1&_t=ZS-9AOczcJsbET" target="_blank" rel="noopener">
      <i class="fa-brands fa-tiktok"></i>
      <span>تيك توك</span>
    </a>
  </div>

  <!-- قسم الـ QR Code الخاص بصفحتك -->
  <div class="qr-container">
    <div class="qr-box">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://najeebalaa40-star.github.io" alt="QR Code">
    </div>
    <div class="hint">
      <i class="fa-solid fa-qrcode"></i> امسح رمز QR أعلاه أو قرّب هاتفك من بطاقة NFC لفتح صفحتك مباشرة.
    </div>
  </div>
</main>

</body>
</html>
